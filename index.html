<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COS3</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 640px;
      padding: 0 16px;
    }

    .buttons {
      display: flex;
      gap: 12px;
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 1.5em;
    }

    #status {
      margin: 0;
      text-align: center;
    }

    #spinner {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border: 2px solid #ccc;
      border-top-color: #333;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #spinner[hidden] {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #spinner {
        animation-duration: 3s;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="buttons">
      <button id="launch-button" onclick="start()">Launch Simulation</button>
      <button id="stop-button" onclick="stop()" disabled>Stop Simulation</button>
    </div>
    <div class="status-row" role="status">
      <div id="spinner" hidden></div>
      <p id="status"></p>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
