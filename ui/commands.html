<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1440">
  <title>Commands</title>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* Styles used only on this page */
    th {
      text-align: left;
      font-weight: 600;
      color: #444;
      border-bottom: 1.5px solid #999;
      padding: 7px 12px;
      background: #F4F4F4
    }

    td {
      border-bottom: 1px solid #DDD;
      padding: 6px 12px
    }

    input,
    select {
      font: 400 13px 'IBM Plex Sans', sans-serif;
      height: 36px;
      border: 1.5px solid #999;
      border-radius: 4px;
      padding: 0 10px;
      box-sizing: border-box;
      background: #fff;
      color: #222;
      width: 100%
    }

    .fld {
      display: flex;
      flex-direction: column;
      gap: 5px
    }

    .pnl {
      background: #fff;
      border: 1.5px solid #999;
      border-radius: 4px;
      box-sizing: border-box;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0
    }

    .pk {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 10px;
      border-radius: 4px;
      font-size: 13px;
      background: none;
      border: 0;
      width: 100%;
      text-align: left;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      color: #222
    }

    .pk.on {
      background: #222;
      color: #fff
    }

    .st {
      font: 600 11px 'IBM Plex Mono', monospace;
      border: 1.5px solid #222;
      padding: 1px 6px;
      border-radius: 3px
    }

    .hint {
      margin: 0;
      color: #555;
      font-size: 13px
    }

    .err {
      margin: 0;
      color: #b00020;
      font-size: 13px
    }

    .lst {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: auto;
      min-height: 0
    }

    /* Debug/Radio switch: a segmented control built from the shared .seg buttons */
    .path {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .path-switch {
      display: flex;
      width: 220px;
      border: 1.5px solid #333;
      border-radius: 4px;
      overflow: hidden;
      background: #fff
    }

    .path-switch .seg {
      height: 32px;
      font-size: 13px;
      border-right-color: #333
    }

    .path-switch .seg:focus-visible {
      outline: 2px solid #222;
      outline-offset: -4px
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <template id="page">
    <div class="wf"
      style="width:1440px;height:900px;display:flex;flex-direction:column;background:#F4F4F4;overflow:hidden">
      <div data-cos3="header" data-status="running"></div>
      <div style="flex:1;display:flex;min-height:0">
        <div data-cos3="nav" data-active="commands"></div>
        <main
          style="flex:1;min-width:0;padding:20px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px">
          <div class="row" style="gap:12px">
            <h1 style="margin:0;font-size:22px">Commands</h1>
            <div style="flex:1"></div>
            <template data-if="{{loggedIn}}">
              <div class="path">
                <div class="path-switch" role="group" aria-labelledby="path-label">
                  <button class="seg {{debugCls}}" onClick="{{toDebug}}" aria-pressed="{{isDebug}}"
                    title="Send straight to the flight software (DEBUG interface)">Debug</button>
                  <button class="seg {{radioCls}}" onClick="{{toRadio}}" aria-pressed="{{isRadio}}"
                    title="Send through the simulated radio (RADIO interface)">Radio</button>
                </div>
              </div>
            </template>
          </div>

          <template data-if="{{checkingSession}}">
            <p class="hint">Checking COSMOS session…</p>
          </template>

          <template data-if="{{loggedOut}}">
            <div style="flex:1;display:flex;align-items:center;justify-content:center">
              <form class="pnl" style="width:360px" onSubmit="{{login}}" aria-label="Log in to COSMOS">
                <div style="font-weight:600;font-size:16px">Log in to COSMOS</div>
                <p class="hint">Sending commands needs a COSMOS session.</p>
                <div class="fld">
                  <label for="cosmos-password">COSMOS password</label>
                  <input id="cosmos-password" type="password" autocomplete="current-password" required autofocus>
                </div>
                <template data-if="{{loginError}}">
                  <p role="alert" class="err">{{loginError}}</p>
                </template>
                <button class="btn" type="submit" disabled="{{loggingIn}}">Log in</button>
              </form>
            </div>
          </template>

          <template data-if="{{loggedIn}}">
          <div style="flex:1;min-height:0;display:flex;gap:16px">
            <section class="pnl" style="width:250px;flex:none" aria-label="Enabled components">
              <div style="font-weight:600">Components</div>
              <input id="component-search" type="search" placeholder="Search components" aria-label="Search components"
                value="{{compQuery}}" onInput="{{searchComps}}">
              <template data-if="{{loading}}">
                <p style="margin:0;color:#555;font-size:13px">Loading components…</p>
              </template>
              <template data-if="{{error}}">
                <p role="alert" style="margin:0;color:#b00020;font-size:13px">{{error}}</p>
              </template>
              <template data-if="{{noCompMatches}}">
                <p class="hint">No matching components.</p>
              </template>
              <div class="lst">
                <template data-for="{{comps}}" data-as="c">
                  <button class="pk {{c.cls}}" onClick="{{c.pick}}" title="{{c.key}}">{{c.name}}</button>
                </template>
              </div>
            </section>

            <section class="pnl" style="width:330px;flex:none" aria-label="Commands">
              <div style="font-weight:600">Commands</div>
              <input id="command-search" type="search" placeholder="Search commands" aria-label="Search commands"
                value="{{cmdQuery}}" onInput="{{searchCmds}}" disabled="{{noComponent}}">
              <template data-if="{{noComponent}}">
                <p class="hint">Select a component.</p>
              </template>
              <template data-if="{{cmdLoading}}">
                <p class="hint">Loading commands…</p>
              </template>
              <template data-if="{{cmdError}}">
                <p role="alert" class="err">{{cmdError}}</p>
              </template>
              <template data-if="{{noCmdMatches}}">
                <p class="hint">No matching commands.</p>
              </template>
              <div class="lst">
                <template data-for="{{cmds}}" data-as="c">
                  <button class="pk {{c.cls}}" onClick="{{c.pick}}" title="{{c.description}}">
                    {{c.label}}
                    <template data-if="{{c.hazardous}}"><span class="st" style="margin-left:auto">HAZARDOUS</span></template>
                  </button>
                </template>
              </div>
            </section>
          </div>
          </template>
        </main>
      </div>
    </div>
  </template>

  <script src="assets/cos3-runtime.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/layout.js"></script>
  <script>
    // Case-insensitive match of a search query against any of the given fields
    function matches(query, ...fields) {
      const q = query.trim().toLowerCase();
      return !q || fields.some((f) => (f || '').toLowerCase().includes(q));
    }

    // onInput handler for a search box: setState re-renders the whole page (cos3-runtime),
    // which replaces the input, so put focus and the cursor back afterwards.
    function searchHandler(component, stateKey) {
      return (e) => {
        const {id, value, selectionStart, selectionEnd} = e.target;
        component.setState({[stateKey]: value}); // synchronous: the new input exists now
        const input = document.getElementById(id);
        if (input) {
          input.focus();
          input.setSelectionRange(selectionStart, selectionEnd);
        }
      };
    }

    class Component extends DCLogic {
      constructor(props) {
        super(props);
        this.state = {
          auth: 'checking', // checking | out | in
          loginError: null, loggingIn: false,
          loading: true, error: null, spacecraft: null, sel: null,
          path: 'DEBUG',
          cmds: null, cmdLoading: false, cmdError: null, cmdSel: null,
          compQuery: '', cmdQuery: ''
        };
        this.searchComps = searchHandler(this, 'compQuery');
        this.searchCmds = searchHandler(this, 'cmdQuery');
      }

      async componentDidMount() {
        const res = await COS3.api.session();
        if (res.loggedIn) {
          this.setState({auth: 'in'});
          this.loadComponents();
        } else {
          this.setState({auth: 'out', loginError: res.error || null});
        }
      }

      // Back to the login view, e.g. when COSMOS rejects the session (expired, or COSMOS restarted)
      logout(message) {
        this.setState({auth: 'out', loginError: message, sel: null, cmds: null, cmdSel: null, cmdError: null});
      }

      async login(event) {
        event.preventDefault();
        const password = event.target.querySelector('input[type=password]').value;
        this.setState({loggingIn: true, loginError: null});
        const res = await COS3.api.login(password);
        if (res.error) return this.setState({loggingIn: false, loginError: res.error});
        this.setState({loggingIn: false, auth: 'in'});
        this.loadComponents();
      }

      async loadComponents() {
        this.setState({loading: true, error: null});
        const res = await COS3.api.components();
        if (res.error) {
          return this.setState({loading: false, error: res.error});
        }

        const sc = res.spacecraft;

        this.setState({
          loading: false,
          spacecraft: sc,
          error: sc && sc.components.length ? null : 'No components are enabled in this simulation.'
        });
      }

      // Load the selected component's commands for the selected path
      async loadCommands() {
        const {sel, path} = this.state;
        if (!sel) return;
        this.setState({cmds: null, cmdLoading: true, cmdError: null, cmdSel: null});
        const res = await COS3.api.commands(sel, path);
        if (sel !== this.state.sel || path !== this.state.path) return; // selection changed while loading
        if (res.status === 401) {
          this.setState({cmdLoading: false});
          return this.logout('Your COSMOS session ended. Log in again.');
        }
        if (res.error) {
          return this.setState({cmdLoading: false, cmdError: res.error});
        }
        this.setState({
          cmdLoading: false,
          cmds: res.commands,
          cmdError: res.commands.length ? null : 'This component has no commands.'
        });
      }

      renderVals() {
        const s = this.state;
        const sc = s.spacecraft;
        const list = sc ? sc.components : [];
        const comps = list.filter((c) => matches(s.compQuery, c.name, c.key)).map((c) => ({
          key: c.key,
          name: c.name,
          cls: c.key === s.sel ? 'on' : '',
          pick: () => {
            if (c.key === s.sel) return;
            // New component: its commands are different, so start their search fresh
            this.setState({sel: c.key, cmdQuery: ''}); // setState is synchronous in cos3-runtime
            this.loadCommands();
          }
        }));

        const allCmds = s.cmds || [];
        const cmds = allCmds.filter((c) => matches(s.cmdQuery, c.name, c.description)).map((c) => ({
          label: c.name,
          description: c.description,
          hazardous: c.hazardous,
          cls: `${c.target} ${c.name}` === s.cmdSel ? 'on' : '',
          pick: () => this.setState({cmdSel: `${c.target} ${c.name}`})
        }));

        const setPath = (path) => () => {
          if (path === s.path) return;
          this.setState({path});
          this.loadCommands();
        };

        return {
          checkingSession: s.auth === 'checking',
          loggedOut: s.auth === 'out',
          loggedIn: s.auth === 'in',
          loginError: s.loginError,
          loggingIn: s.loggingIn,
          login: (e) => this.login(e),

          loading: s.loading,
          error: s.error,
          comps,
          count: list.length,
          compQuery: s.compQuery,
          searchComps: this.searchComps,
          noCompMatches: list.length > 0 && comps.length === 0,

          cmds,
          cmdCount: cmds.length,
          cmdQuery: s.cmdQuery,
          searchCmds: this.searchCmds,
          noCmdMatches: allCmds.length > 0 && cmds.length === 0,
          noComponent: !s.sel,
          cmdLoading: s.cmdLoading,
          cmdError: s.cmdError,
          isDebug: s.path === 'DEBUG', isRadio: s.path === 'RADIO',
          debugCls: s.path === 'DEBUG' ? 'on' : '', radioCls: s.path === 'RADIO' ? 'on' : '',
          toDebug: setPath('DEBUG'), toRadio: setPath('RADIO')
        };
      }
    }

    COS3.mount(Component, {});
  </script>
</body>

</html>
