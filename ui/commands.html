<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1440">
  <title>Commands</title>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* Styles used only on this page */
    th {
      text-align: left;
      font-weight: 600;
      color: #444;
      border-bottom: 1.5px solid #999;
      padding: 7px 12px;
      background: #F4F4F4
    }

    td {
      border-bottom: 1px solid #DDD;
      padding: 6px 12px
    }

    input,
    select {
      font: 400 13px 'IBM Plex Sans', sans-serif;
      height: 36px;
      border: 1.5px solid #999;
      border-radius: 4px;
      padding: 0 10px;
      box-sizing: border-box;
      background: #fff;
      color: #222;
      width: 100%
    }

    .fld {
      display: flex;
      flex-direction: column;
      gap: 5px
    }

    .pnl {
      background: #fff;
      border: 1.5px solid #999;
      border-radius: 4px;
      box-sizing: border-box;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0
    }

    .pk {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 10px;
      border-radius: 4px;
      font-size: 13px;
      background: none;
      border: 0;
      width: 100%;
      text-align: left;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      color: #222
    }

    .pk.on {
      background: #222;
      color: #fff
    }

    .st {
      font: 600 11px 'IBM Plex Mono', monospace;
      border: 1.5px solid #222;
      padding: 1px 6px;
      border-radius: 3px
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <template id="page">
    <div class="wf"
      style="width:1440px;height:900px;display:flex;flex-direction:column;background:#F4F4F4;overflow:hidden">
      <div data-cos3="header" data-status="running"></div>
      <div style="flex:1;display:flex;min-height:0">
        <div data-cos3="nav" data-active="commands"></div>
        <main
          style="flex:1;min-width:0;padding:20px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px">
          <div class="row" style="gap:12px">
            <h1 style="margin:0;font-size:22px">Commands</h1>
          </div>

          <div style="flex:1;min-height:0;display:flex;gap:16px">
            <section class="pnl" style="width:250px;flex:none" aria-label="Enabled components">
              <div style="font-weight:600">Target<span style="color:#555;font-weight:400">({{count}})</span></div>
              <template data-if="{{loading}}">
                <p style="margin:0;color:#555;font-size:13px">Loading components…</p>
              </template>
              <template data-if="{{error}}">
                <p role="alert" style="margin:0;color:#b00020;font-size:13px">{{error}}</p>
              </template>
              <div style="display:flex;flex-direction:column;gap:2px;overflow:auto">
                <template data-for="{{comps}}" data-as="c">
                  <button class="pk {{c.cls}}" onClick="{{c.pick}}" title="{{c.key}}">{{c.name}}</button>
                </template>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>
  </template>

  <script src="assets/cos3-runtime.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/layout.js"></script>
  <script>
    class Component extends DCLogic {
      constructor(props) {
        super(props);
        this.state = {loading: true, error: null, spacecraft: null, sel: null};
      }

      async componentDidMount() {
        const res = await COS3.api.components();
        if (res.error) {
          return this.setState({loading: false, error: res.error});
        }

        const sc = res.spacecraft;

        this.setState({
          loading: false,
          spacecraft: sc,
          error: sc && sc.components.length ? null : 'No components are enabled in this simulation.'
        });
      }

      renderVals() {
        const sc = this.state.spacecraft;
        const list = sc ? sc.components : [];
        const comps = list.map((c) => ({
          key: c.key,
          name: c.name,
          cls: c.key === this.state.sel ? 'on' : '',
          pick: () => this.setState({sel: c.key})
        }));
        return {
          loading: this.state.loading,
          error: this.state.error,
          comps,
          count: list.length,
        };
      }
    }

    COS3.mount(Component, {});
  </script>
</body>

</html>
