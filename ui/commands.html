<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1440">
  <title>Commands</title>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* Styles used only on this page */
    th {
      text-align: left;
      font-weight: 600;
      color: #444;
      border-bottom: 1.5px solid #999;
      padding: 7px 12px;
      background: #F4F4F4
    }

    td {
      border-bottom: 1px solid #DDD;
      padding: 6px 12px
    }

    input,
    select {
      font: 400 13px 'IBM Plex Sans', sans-serif;
      height: 36px;
      border: 1.5px solid #999;
      border-radius: 4px;
      padding: 0 10px;
      box-sizing: border-box;
      background: #fff;
      color: #222;
      width: 100%
    }

    .fld {
      display: flex;
      flex-direction: column;
      gap: 5px
    }

    .pnl {
      background: #fff;
      border: 1.5px solid #999;
      border-radius: 4px;
      box-sizing: border-box;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0
    }

    .pk {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 10px;
      border-radius: 4px;
      font-size: 13px;
      background: none;
      border: 0;
      width: 100%;
      text-align: left;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      color: #222
    }

    .pk.on {
      background: #222;
      color: #fff
    }

    .st {
      font: 600 11px 'IBM Plex Mono', monospace;
      border: 1.5px solid #222;
      padding: 1px 6px;
      border-radius: 3px
    }

    .hint {
      margin: 0;
      color: #555;
      font-size: 13px
    }

    .err {
      margin: 0;
      color: #b00020;
      font-size: 13px
    }

    .lst {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: auto;
      min-height: 0
    }

    .seg {
      display: flex
    }

    .seg .btn {
      flex: 1
    }

    .seg .btn:first-child {
      border-radius: 4px 0 0 4px
    }

    .seg .btn:last-child {
      border-radius: 0 4px 4px 0;
      border-left: 0
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <template id="page">
    <div class="wf"
      style="width:1440px;height:900px;display:flex;flex-direction:column;background:#F4F4F4;overflow:hidden">
      <div data-cos3="header" data-status="running"></div>
      <div style="flex:1;display:flex;min-height:0">
        <div data-cos3="nav" data-active="commands"></div>
        <main
          style="flex:1;min-width:0;padding:20px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px">
          <div class="row" style="gap:12px">
            <h1 style="margin:0;font-size:22px">Commands</h1>
          </div>

          <div style="flex:1;min-height:0;display:flex;gap:16px">
            <section class="pnl" style="width:250px;flex:none" aria-label="Enabled components">
              <div style="font-weight:600">Target<span style="color:#555;font-weight:400">({{count}})</span></div>
              <template data-if="{{loading}}">
                <p style="margin:0;color:#555;font-size:13px">Loading components…</p>
              </template>
              <template data-if="{{error}}">
                <p role="alert" style="margin:0;color:#b00020;font-size:13px">{{error}}</p>
              </template>
              <div class="lst">
                <template data-for="{{comps}}" data-as="c">
                  <button class="pk {{c.cls}}" onClick="{{c.pick}}" title="{{c.key}}">{{c.name}}</button>
                </template>
              </div>
            </section>

            <section class="pnl" style="width:330px;flex:none" aria-label="Commands">
              <div style="font-weight:600">Commands <span style="color:#555;font-weight:400">({{cmdCount}})</span></div>
              <div class="seg" role="group" aria-label="Command path">
                <button class="btn sm {{debugCls}}" onClick="{{toDebug}}" aria-pressed="{{isDebug}}">DEBUG</button>
                <button class="btn sm {{radioCls}}" onClick="{{toRadio}}" aria-pressed="{{isRadio}}">RADIO</button>
              </div>
              <template data-if="{{noComponent}}">
                <p class="hint">Select a component.</p>
              </template>
              <template data-if="{{cmdLoading}}">
                <p class="hint">Loading commands…</p>
              </template>
              <template data-if="{{needLogin}}">
                <form class="fld" onSubmit="{{login}}">
                  <label for="cosmos-password">COSMOS password</label>
                  <input id="cosmos-password" type="password" autocomplete="current-password" required>
                  <button class="btn sm" type="submit">Log in</button>
                </form>
              </template>
              <template data-if="{{cmdError}}">
                <p role="alert" class="err">{{cmdError}}</p>
              </template>
              <div class="lst">
                <template data-for="{{cmds}}" data-as="c">
                  <button class="pk {{c.cls}}" onClick="{{c.pick}}" title="{{c.description}}">
                    {{c.label}}
                    <template data-if="{{c.hazardous}}"><span class="st" style="margin-left:auto">HAZARDOUS</span></template>
                  </button>
                </template>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>
  </template>

  <script src="assets/cos3-runtime.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/layout.js"></script>
  <script>
    class Component extends DCLogic {
      constructor(props) {
        super(props);
        this.state = {
          loading: true, error: null, spacecraft: null, sel: null,
          path: 'DEBUG',
          cmds: null, cmdLoading: false, cmdError: null, needLogin: false, cmdSel: null
        };
      }

      async componentDidMount() {
        const res = await COS3.api.components();
        if (res.error) {
          return this.setState({loading: false, error: res.error});
        }

        const sc = res.spacecraft;

        this.setState({
          loading: false,
          spacecraft: sc,
          error: sc && sc.components.length ? null : 'No components are enabled in this simulation.'
        });
      }

      // Load the selected component's commands for the selected path
      async loadCommands() {
        const {sel, path} = this.state;
        if (!sel) return;
        this.setState({cmds: null, cmdLoading: true, cmdError: null, needLogin: false, cmdSel: null});
        const res = await COS3.api.commands(sel, path);
        if (sel !== this.state.sel || path !== this.state.path) return; // selection changed while loading
        if (res.error) {
          return this.setState({cmdLoading: false, needLogin: res.status === 401, cmdError: res.error});
        }
        this.setState({
          cmdLoading: false,
          cmds: res.commands,
          cmdError: res.commands.length ? null : 'This component has no commands.'
        });
      }

      async login(event) {
        event.preventDefault();
        const password = event.target.querySelector('input').value;
        const res = await COS3.api.login(password);
        if (res.error) return this.setState({cmdError: res.error});
        this.loadCommands();
      }

      renderVals() {
        const s = this.state;
        const sc = s.spacecraft;
        const list = sc ? sc.components : [];
        const comps = list.map((c) => ({
          key: c.key,
          name: c.name,
          cls: c.key === s.sel ? 'on' : '',
          pick: () => {
            if (c.key === s.sel) return;
            this.setState({sel: c.key}); // setState is synchronous in cos3-runtime
            this.loadCommands();
          }
        }));

        const cmds = (s.cmds || []).map((c) => ({
          label: c.name,
          description: c.description,
          hazardous: c.hazardous,
          cls: `${c.target} ${c.name}` === s.cmdSel ? 'on' : '',
          pick: () => this.setState({cmdSel: `${c.target} ${c.name}`})
        }));

        const setPath = (path) => () => {
          if (path === s.path) return;
          this.setState({path});
          this.loadCommands();
        };

        return {
          loading: s.loading,
          error: s.error,
          comps,
          count: list.length,

          cmds,
          cmdCount: cmds.length,
          noComponent: !s.sel,
          cmdLoading: s.cmdLoading,
          cmdError: s.cmdError,
          needLogin: s.needLogin,
          login: (e) => this.login(e),
          isDebug: s.path === 'DEBUG', isRadio: s.path === 'RADIO',
          debugCls: s.path === 'DEBUG' ? 'on' : '', radioCls: s.path === 'RADIO' ? 'on' : '',
          toDebug: setPath('DEBUG'), toRadio: setPath('RADIO')
        };
      }
    }

    COS3.mount(Component, {});
  </script>
</body>

</html>
