<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>COS3 – Events &amp; Logs</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/style.css">
<style>
/* Styles used only on this page */
th{text-align:left;font-weight:600;color:#444;border-bottom:1.5px solid #999;padding:9px 14px;background:#F4F4F4}
td{border-bottom:1px solid #DDD;padding:8px 14px}
input,select{font:400 13px 'IBM Plex Sans',sans-serif;height:36px;border:1.5px solid #999;border-radius:4px;padding:0 10px;box-sizing:border-box;background:#fff;color:#222;width:100%}
</style>
</head>
<body>
<div id="app"></div>

<!-- Page markup. {{name}} values come from renderVals() in the script below.
     Header and sidebar are shared: see assets/layout.js. -->
<template id="page">
<div class="wf" style="width:1440px;height:900px;display:flex;flex-direction:column;background:#F4F4F4;overflow:hidden">
<div data-cos3="header" data-status="running"></div>
<div style="flex:1;display:flex;min-height:0">
<div data-cos3="nav" data-active="events"></div>
<main style="flex:1;min-width:0;padding:20px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px">
<div class="row" style="gap:12px"><h1 style="margin:0;font-size:22px">Events &amp; Logs</h1><div style="flex:1"></div><span class="tag">◆ Flight software events</span><span class="tag">◆ COSMOS</span><span class="tag">◆ NOS Engine</span></div>

<div class="box" style="padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
<input type="search" placeholder="Search…" aria-label="Search events" style="width:300px">
<div class="row" role="group" aria-label="Severity">
<template data-for="{{sevs}}" data-as="s">
<button class="btn sm {{s.cls}}" onClick="{{s.toggle}}" aria-pressed="{{s.on}}">{{s.name}}</button>
</template>
</div>
<select aria-label="Source" style="width:160px"><option>All sources</option><option>Flight software</option><option>COSMOS</option><option>NOS Engine</option><option>42</option></select>
<div style="flex:1"></div>




</div>

<section class="box" style="flex:1;min-height:0;overflow:hidden">
<table>
<thead><tr><th style="width:130px">Time (UTC)</th><th style="width:100px">Severity</th><th style="width:150px">Source</th><th>Message</th></tr></thead>
<tbody>
<template data-for="{{rows}}" data-as="r">
<tr><td class="mono">[hh:mm:ss]</td><td><span class="sev" style="{{r.ss}}">{{r.sev}}</span></td><td>{{r.src}}</td><td>{{r.msg}}</td></tr>
</template>
</tbody>
</table>
</section>
</main>
</div>
</div>
</template>

<script src="assets/cos3-runtime.js"></script>
<script src="assets/layout.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { off: {} }; }
  renderVals() {
    const off = this.state.off;
    const sevs = ['INFO', 'WARNING', 'ERROR', 'CRITICAL'].map((n) => ({
      name: n, on: off[n] ? 'false' : 'true', cls: off[n] ? '' : 'on',
      toggle: () => this.setState({ off: Object.assign({}, off, { [n]: !off[n] }) })
    }));
    const S = { INFO: 'border-style:dashed;', WARN: '', ERROR: 'background:#222;color:#fff;', CRIT: 'background:#222;color:#fff;outline:2px solid #222;outline-offset:1px;' };
    const rows = [
      ['INFO', 'Flight software', 'Command received'],
      ['WARN', 'NOS Engine', 'Sun sensor reading outside expected range'],
      ['ERROR', 'COS3', 'Ground software lost connection to flight software']
    ].filter(([s]) => !off[s === 'WARN' ? 'WARNING' : s === 'CRIT' ? 'CRITICAL' : s])
     .map(([sev, src, msg]) => ({ sev, ss: S[sev], src, msg }));
    return { yes: true, sevs, rows };
  }
}

COS3.mount(Component, {});
</script>
</body>
</html>
