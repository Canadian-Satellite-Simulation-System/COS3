<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>COS3 – Simulation Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/style.css">
<style>
/* Styles used only on this page */
th{text-align:left;font-weight:600;color:#444;border-bottom:1.5px solid #999;padding:6px 10px;background:#F4F4F4;font-size:12px}
td{border-bottom:1px solid #DDD;padding:6px 10px}
.pnl{background:#fff;border:1.5px solid #999;border-radius:4px;box-sizing:border-box;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.st{display:flex;gap:6px;align-items:center}
</style>
</head>
<body>
<div id="app"></div>

<!-- Page markup. {{name}} values come from renderVals() in the script below.
     Header and sidebar are shared: see assets/layout.js. -->
<template id="page">
<div class="wf" style="width:1440px;height:900px;display:flex;flex-direction:column;background:#F4F4F4;overflow:hidden">
<div data-cos3="header" data-status="running"></div>
<div style="flex:1;display:flex;min-height:0">
<div data-cos3="nav" data-active="dashboard"></div>
<main style="flex:1;min-width:0;padding:20px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px">
<div class="row" style="gap:12px"><h1 style="margin:0;font-size:22px">Dashboard</h1><span style="font-size:13px;color:#555">SAT-1</span><div style="flex:1"></div></div>

<div style="flex:1;min-height:0;display:grid;grid-template-columns:380px minmax(0,1fr) 320px;gap:16px">

<div style="display:flex;flex-direction:column;gap:16px;min-height:0">
<section class="pnl">
<div class="row"><span class="h" style="flex:1">Services</span><span class="tag">◆ NOS3 processes</span></div>
<table><tbody>
<tr><td style="font-weight:600">NOS Engine</td><td><span class="st"><span class="dot off"></span>[STATUS]</span></td></tr>
<tr><td style="font-weight:600">Flight software</td><td><span class="st"><span class="dot off"></span>[STATUS]</span></td></tr>
<tr><td style="font-weight:600">42</td><td><span class="st"><span class="dot off"></span>[STATUS]</span></td></tr>
<tr><td style="font-weight:600">Ground software</td><td><span class="st"><span class="dot off"></span>[STATUS]</span></td></tr>
</tbody></table>
</section>
<section class="pnl" style="flex:1">
<div class="row"><span class="h" style="flex:1">Component health</span><span class="tag">◆ Flight software telemetry</span></div>
<table>
<thead><tr><th>Component</th><th>Mode</th><th>Status</th></tr></thead>
<tbody>
<template data-for="{{comps}}" data-as="c">
<tr><td>{{c.n}}</td><td class="mono" style="font-size:12px">[MODE]</td><td><span class="st"><span class="dot off"></span>[STATUS]</span></td></tr>
</template>
</tbody>
</table>
</section>
</div>

<div style="display:flex;flex-direction:column;gap:16px;min-height:0">
<section class="pnl" style="flex:1">
<div class="row"><span class="h" style="flex:1">Orbit</span><span class="tag">◆ 42</span><a href="orbit.html" class="btn sm">Open ▸</a></div>
<div class="ph" style="flex:1"><span><br></span></div>
</section>
</div>

<div style="display:flex;flex-direction:column;gap:16px;min-height:0">
<section class="pnl" style="flex:1">
<div class="row"><span class="h" style="flex:1">Latest alerts</span><span class="tag">◆ Ground · flight software</span></div>
<template data-for="{{alerts}}" data-as="a">
<div style="display:flex;gap:10px;padding:8px 10px;border:1px solid #CCC;border-radius:4px">
<span class="mono" style="font-size:11px;font-weight:600;border:1.5px solid #222;padding:1px 6px;border-radius:3px;height:16px;line-height:16px;{{a.sevStyle}}">{{a.sev}}</span>
<div style="display:flex;flex-direction:column;gap:2px;flex:1"><span style="font-size:13px">{{a.msg}}</span><span class="mono" style="font-size:11px;color:#555">[hh:mm:ss]</span></div>
</div>
</template>
<div style="flex:1"></div>
<a href="events.html" class="btn sm" style="align-self:flex-start">View all ▸</a>
</section>
</div>

</div>
</main>
</div>
</div>
</template>

<script src="assets/cos3-runtime.js"></script>
<script src="assets/layout.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { app: '[App 1]' }; }
  renderVals() {
    const comps = [1, 2, 3, 4].map((i) => ({ n: '[Component ' + i + ']' }));
    const apps = [1, 2, 3, 4].map((i) => '[App ' + i + ']').map((n) => ({ n, s: '[STATUS]', d: 'off', cls: this.state.app === n ? 'on' : '', pick: () => this.setState({ app: n }) }));
    const alerts = [1, 2, 3].map(() => ({ sev: '[LEVEL]', sevStyle: '', msg: '[Alert message]' }));
    return { yes: true, comps, apps, alerts, sel: 'Selected: ' + this.state.app };
  }
}

COS3.mount(Component, {});
</script>
</body>
</html>
